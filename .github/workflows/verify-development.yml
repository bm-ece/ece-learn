name: Verify development site structure

on:
  push:
    branches: [develop/multicourse-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static site and JavaScript
        run: node tests/smoke-static.mjs
